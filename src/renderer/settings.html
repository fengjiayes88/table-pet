<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>七七 · 设置</title>
  <style>
    :root {
      --bg: #F2EDE6;
      --bg-soft: #E7DDD2;
      --card: rgba(255, 252, 247, 0.88);
      --card-solid: #FFFCF7;
      --text: #5F5A52;
      --muted: #92897E;
      --line: #E3D8CD;
      --sage: #9DAF9E;
      --sage-dark: #7E957F;
      --clay: #C9967A;
      --rose: #D8B7AA;
      --danger: #B87575;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      user-select: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 8%, rgba(216, 183, 170, 0.36), transparent 32%),
        radial-gradient(circle at 88% 12%, rgba(157, 175, 158, 0.34), transparent 30%),
        linear-gradient(145deg, var(--bg), var(--bg-soft));
    }
    .header {
      position: relative;
      padding: 22px 22px 16px;
      background: linear-gradient(135deg, rgba(255,252,247,0.82), rgba(239,230,220,0.68));
      border-bottom: 1px solid rgba(227, 216, 205, 0.72);
      box-shadow: 0 8px 24px rgba(111, 96, 82, 0.08);
    }
    .header::before {
      content: '';
      position: absolute;
      right: 22px;
      top: 20px;
      width: 42px;
      height: 42px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--sage), var(--rose));
      opacity: 0.52;
      box-shadow: 0 10px 22px rgba(126, 149, 127, 0.18);
    }
    .header h2 {
      position: relative;
      font-size: 18px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #5B554D;
    }
    .header h2::after {
      content: '温柔陪伴你的桌面小伙伴';
      display: block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .body {
      height: calc(100vh - 78px);
      padding: 14px 16px 16px;
      overflow-y: auto;
    }
    .body::-webkit-scrollbar { width: 0; }
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 48px;
      margin-bottom: 9px;
      padding: 11px 12px;
      border: 1px solid rgba(227, 216, 205, 0.82);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 6px 18px rgba(111, 96, 82, 0.07);
      backdrop-filter: blur(8px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .item:hover {
      transform: translateY(-1px);
      border-color: rgba(157, 175, 158, 0.7);
      box-shadow: 0 9px 22px rgba(111, 96, 82, 0.1);
    }
    .item > label:first-child {
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .slider {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .slider input[type="range"] {
      width: 128px;
      height: 5px;
      -webkit-appearance: none;
      background: linear-gradient(90deg, var(--sage), #DED4C9);
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    .slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      background: var(--card-solid);
      border: 3px solid var(--clay);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(126, 103, 88, 0.22);
    }
    .slider-value {
      min-width: 42px;
      padding: 3px 7px;
      border-radius: 999px;
      background: rgba(157, 175, 158, 0.14);
      color: var(--sage-dark);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch-slider {
      position: absolute;
      inset: 0;
      background: #D7CEC4;
      border-radius: 999px;
      transition: background 0.25s, box-shadow 0.25s;
      cursor: pointer;
    }
    .switch-slider::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #FFFCF7;
      border-radius: 50%;
      transition: transform 0.25s;
      box-shadow: 0 3px 8px rgba(111, 96, 82, 0.2);
    }
    .switch input:checked + .switch-slider {
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      box-shadow: 0 4px 12px rgba(126, 149, 127, 0.26);
    }
    .switch input:checked + .switch-slider::before { transform: translateX(20px); }
    .interval-input {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 8px 3px 4px;
      border: 1px solid rgba(227, 216, 205, 0.95);
      border-radius: 12px;
      background: rgba(255, 252, 247, 0.9);
    }
    .interval-input input[type="number"] {
      width: 58px;
      padding: 4px 6px;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: rgba(157, 175, 158, 0.12);
      outline: none;
      text-align: center;
    }
    .interval-input:focus-within {
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(157, 175, 158, 0.14);
    }
    .interval-input input[type="number"]:disabled {
      background: #EEE8E1;
      color: #B5AAA0;
      cursor: not-allowed;
    }
    .interval-input .unit {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }
    .quit-row {
      padding-top: 4px;
      display: flex;
      justify-content: center;
    }
    .quit-btn {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(184, 117, 117, 0.28);
      background: linear-gradient(135deg, rgba(255,252,247,0.92), rgba(216,183,170,0.22));
      color: var(--danger);
      font-size: 13px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(184, 117, 117, 0.08);
      transition: transform 0.16s ease, background 0.16s ease, border-color 0.16s ease;
    }
    .quit-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(184, 117, 117, 0.45);
      background: linear-gradient(135deg, #FFFCF7, rgba(216,183,170,0.34));
    }
    .quit-btn:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="header">
    <h2>七七 · 设置</h2>
  </div>
  <div class="body">
    <div class="item">
      <label>宠物大小</label>
      <div class="slider">
        <input type="range" id="size" min="0.5" max="2.0" step="0.1" value="1.0">
        <span class="slider-value" id="size-val">100%</span>
      </div>
    </div>
    <div class="item">
      <label>透明度</label>
      <div class="slider">
        <input type="range" id="opacity" min="0.2" max="1.0" step="0.05" value="0.95">
        <span class="slider-value" id="opacity-val">95%</span>
      </div>
    </div>
    <div class="item">
      <label>始终置顶</label>
      <label class="switch">
        <input type="checkbox" id="ontop" checked>
        <span class="switch-slider"></span>
      </label>
    </div>
    <div class="item">
      <label>休息提醒</label>
      <label class="switch">
        <input type="checkbox" id="reminder-enabled" checked>
        <span class="switch-slider"></span>
      </label>
    </div>
    <div class="item" id="interval-group">
      <label>提醒间隔</label>
      <div class="interval-input">
        <input type="number" id="reminder-interval" min="1" max="999" step="1" value="45">
        <span class="unit">分钟</span>
      </div>
    </div>
    <div class="item">
      <label>开机自启</label>
      <label class="switch">
        <input type="checkbox" id="autolaunch" checked>
        <span class="switch-slider"></span>
      </label>
    </div>
    <div class="quit-row">
      <button class="quit-btn" id="quit-btn">退出七七</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
