<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'self'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七七 · 设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="titlebar-drag" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="hero">
      <div class="eyebrow">QIXI DESKTOP COMPANION</div>
      <div class="hero-main">
        <div class="avatar" aria-hidden="true">
          <img src="../../assets/tray-icon.png" alt="">
        </div>
        <div class="hero-copy">
          <h1>七七设置</h1>
          <p>让这位桌面小伙伴，更懂你的习惯。</p>
        </div>
      </div>
      <div class="save-status is-ready" id="save-status" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="save-status-text">设置已同步</span>
      </div>
    </header>

    <div class="content">
      <section class="settings-section" aria-labelledby="appearance-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">APPEARANCE</p>
            <h2 id="appearance-title">外观</h2>
          </div>
          <span class="section-icon" aria-hidden="true">✦</span>
        </div>

        <div class="panel">
          <div class="setting-row slider-row">
            <div class="setting-copy">
              <label for="size">宠物大小</label>
              <p>调整七七在桌面上的占用空间</p>
            </div>
            <div class="slider-control">
              <span class="slider-value" id="size-val">100%</span>
              <input type="range" id="size" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
          </div>

          <div class="divider"></div>

          <div class="setting-row slider-row">
            <div class="setting-copy">
              <label for="opacity">透明度</label>
              <p>降低存在感，避免遮挡工作内容</p>
            </div>
            <div class="slider-control">
              <span class="slider-value" id="opacity-val">95%</span>
              <input type="range" id="opacity" min="0.2" max="1.0" step="0.05" value="0.95">
            </div>
          </div>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="behavior-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">BEHAVIOR</p>
            <h2 id="behavior-title">行为</h2>
          </div>
          <span class="section-icon warm" aria-hidden="true">●</span>
        </div>

        <div class="panel behavior-panel">
          <div class="setting-row compact-row">
            <div class="setting-copy">
              <label for="ontop">始终置顶</label>
              <p>让七七保持在其他窗口上方</p>
            </div>
            <label class="switch" aria-label="始终置顶">
              <input type="checkbox" id="ontop" checked>
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
          </div>

          <div class="divider"></div>

          <div class="setting-row compact-row">
            <div class="setting-copy">
              <label for="reminder-enabled">休息提醒</label>
              <p>工作一段时间后提醒你活动一下</p>
            </div>
            <label class="switch" aria-label="休息提醒">
              <input type="checkbox" id="reminder-enabled" checked>
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
          </div>

          <div class="sub-setting" id="interval-group">
            <label for="reminder-interval">提醒间隔</label>
            <div class="number-control">
              <input type="number" id="reminder-interval" min="1" max="999" step="1" value="45">
              <span>分钟</span>
            </div>
          </div>

          <div class="divider"></div>

          <div class="setting-row compact-row">
            <div class="setting-copy">
              <label for="autolaunch">开机自启</label>
              <p>登录系统后自动唤醒七七</p>
            </div>
            <label class="switch" aria-label="开机自启">
              <input type="checkbox" id="autolaunch" checked>
              <span class="switch-track"><span class="switch-thumb"></span></span>
            </label>
          </div>
        </div>
      </section>

      <footer class="footer">
        <p><kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>S</kbd> 随时打开设置</p>
        <button class="quit-btn" id="quit-btn" type="button">退出七七</button>
      </footer>
    </div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
