<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七七提醒</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
    }
    body { display: grid; place-items: center; padding: 4px; }
    .bubble {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px 9px 14px;
      border: 1.5px solid #E8923F;
      border-radius: 15px;
      color: #5D4E37;
      background: #FFF8E7;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.15);
    }
    .icon { color: #E8923F; font-size: 17px; }
    .message { flex: 1; font-size: 13px; font-weight: 600; white-space: nowrap; }
    button {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 50%;
      color: #7A6B59;
      background: rgba(93, 78, 55, 0.10);
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: rgba(93, 78, 55, 0.18); }
  </style>
</head>
<body>
  <div class="bubble">
    <span class="icon" aria-hidden="true">⚡</span>
    <span class="message" id="message">该休息啦～</span>
    <button id="dismiss" type="button" aria-label="关闭提醒">×</button>
  </div>
  <script src="reminder-bubble.js"></script>
</body>
</html>
